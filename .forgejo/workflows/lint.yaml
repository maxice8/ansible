name: Infrastructure Checks
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master", "stable", "release/v*"]

jobs:
  lint:
    runs-on: alpine
    # Relative /var/run symlinks avoid Podman 5.8.7's archive-copy regression.
    container:
      image: node:20-alpine
    env:
      NIX_REMOTE: local
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        sandbox = false
    steps:
      - name: Install validation tools
        shell: sh
        run: apk add --no-cache bash git python3 nix

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint Python
        uses: https://github.com/astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          github-token: ""
          args: "check ."

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check bootstrap syntax
        run: bash -n bootstrap.sh

      - name: Validate component update mappings
        run: python3 scripts/update_component.py --check

      - name: Evaluate Mashu configuration
        run: nix eval --no-write-lock-file --raw .#systemConfigs.mashu.drvPath
