name: Gitleaks Security Audit
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scan:
    name: Gitleaks Scan
    runs-on: alpine
    # Checkout actions need Node; Alpine avoids Podman's absolute-symlink copy bug.
    container:
      image: node:20-alpine
    steps:
      - name: Install checkout tools
        shell: sh
        run: apk add --no-cache bash git

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: docker://zricethezav/gitleaks:v8.30.0
        with:
          args: git --redact --verbose
