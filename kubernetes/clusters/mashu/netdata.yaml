apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netdata
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://netdata.github.io/helmchart/
      chart: netdata
      targetRevision: 3.7.171
      helm:
        releaseName: netdata
        values: |
          ingress:
            enabled: false

          httpRoute:
            enabled: false

          parent:
            envFrom:
              - secretRef:
                  name: netdata-notifications
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            database:
              storageclass: local-path
              volumesize: 5Gi
            alarms:
              storageclass: local-path
              volumesize: 1Gi
            configs:
              anonymous-statistics:
                enabled: true
                path: /etc/netdata/.opt-out-from-anonymous-statistics
                data: ""
              netdata:
                data: |
                  [global]
                    hostname = netdata-parent

                  [db]
                    mode = dbengine
                    storage tiers = 2
                    dbengine tier 0 retention size = 1GiB
                    dbengine tier 0 retention time = 7d
                    dbengine tier 1 retention size = 1GiB
                    dbengine tier 1 retention time = 30d

                  [plugins]
                    cgroups = no
                    tc = no
                    enable running new plugins = no
                    check for new plugins every = 72000
                    python.d = no
                    charts.d = no
                    go.d = no
                    node.d = no
                    apps = no
                    proc = no
                    idlejitter = no
                    diskspace = no
              health:
                data: |
                  SEND_EMAIL="NO"
                  SEND_DISCORD="${NETDATA_DISCORD_WEBHOOK_URL:+YES}"
                  DISCORD_WEBHOOK_URL="${NETDATA_DISCORD_WEBHOOK_URL}"
                  DEFAULT_RECIPIENT_DISCORD="netdata-alerts"

          child:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 768Mi
            configs:
              anonymous-statistics:
                enabled: true
                path: /etc/netdata/.opt-out-from-anonymous-statistics
                data: ""
              kubelet:
                enabled: false
              kubeproxy:
                enabled: false

          k8sState:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            persistence:
              storageclass: local-path
              volumesize: 1Gi
            configs:
              anonymous-statistics:
                enabled: true
                path: /etc/netdata/.opt-out-from-anonymous-statistics
                data: ""

          netdataOpentelemetry:
            enabled: false

          otel-collector:
            enabled: false
    - repoURL: https://github.com/maxice8/ansible.git
      targetRevision: master
      path: kubernetes/apps/netdata
  destination:
    server: https://kubernetes.default.svc
    namespace: netdata
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
