apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: certificate-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maxice8/ansible.git
    targetRevision: master
    path: kubernetes/platform/certificate-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
