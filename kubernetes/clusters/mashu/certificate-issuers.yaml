apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: certificate-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default
  source:
    repoURL: https://git.maxice8.com/max/ansible.git
    targetRevision: master
    path: kubernetes/platform/certificate-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
