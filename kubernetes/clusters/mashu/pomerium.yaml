apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pomerium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maxice8/ansible.git
    targetRevision: master
    path: kubernetes/apps/pomerium
  destination:
    server: https://kubernetes.default.svc
    namespace: pomerium
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
