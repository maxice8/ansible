    deployed_version:
      url: https://raw.githubusercontent.com/maxice8/ansible/master/kubernetes/apps/syncthing/deployment.yaml
      regex: 'syncthing:([0-9.]+)'
    dashboard:
      web_url: https://github.com/syncthing/syncthing/releases/tag/v{{ version }}

  whoami:
    notify:
      discord: {}
    latest_version:
      url: traefik/whoami
      url_commands:
        - type: regex
          regex: '^v([0-9.]+)$'
      require:
        docker:
          type: hub
          image: traefik/whoami
          tag: 'v{{ version }}'
    deployed_version:
      url: https://raw.githubusercontent.com/maxice8/ansible/master/kubernetes/apps/whoami/deployment.yaml
      regex: 'whoami:v([0-9.]+)'
    dashboard:
