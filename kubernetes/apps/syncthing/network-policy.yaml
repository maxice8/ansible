apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncthing-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: syncthing-heartbeat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pomerium
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: fd42:10:42::/56
      ports:
        - port: http
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - port: sync-tcp
          protocol: TCP
        - port: sync-quic
          protocol: UDP
        - port: discovery
          protocol: UDP
