apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.13.0
          imagePullPolicy: Always
          env:
            - name: APP_URL
              value: https://id.maxice8.com
            - name: TRUST_PROXY
              value: "true"
          envFrom:
            - secretRef:
                name: pocket-id-credentials
          ports:
            - name: http
              containerPort: 1411
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            periodSeconds: 30
          startupProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            failureThreshold: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
        - name: tmp
          emptyDir: {}
