apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pomerium-authenticate
spec:
  hostnames:
    - pomerium.maxice8.com
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - name: pomerium
          port: 30006
